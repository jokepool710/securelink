server {
    listen 80;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;

    # The static application has no inline scripts, external fonts, or third-party assets.
    # HTTPS API deployments are supported through the public VITE_API_BASE build setting.
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self' https: http://localhost:8000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=(), payment=(), usb=()" always;
    add_header X-Frame-Options "DENY" always;

    location / {
        try_files $uri /index.html;
    }
}
