services:
  api:
    build: .
    env_file: .env
    ports: ["8000:8000"]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
  web:
    build:
      context: ./frontend
      args:
        # Vite embeds this public API address at build time; it must never contain a secret.
        VITE_API_BASE: ${VITE_API_BASE:-http://localhost:8000}
    ports: ["8080:80"]
    depends_on:
      api:
        condition: service_healthy
    read_only: true
    tmpfs: [/var/cache/nginx, /var/run, /tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
