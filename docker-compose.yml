services:
  api:
    build: .
    env_file: .env
    ports: ["8000:8000"]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
  web:
    build: ./frontend
    ports: ["8080:80"]
    depends_on: [api]
    read_only: true
    tmpfs: [/var/cache/nginx, /var/run, /tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
