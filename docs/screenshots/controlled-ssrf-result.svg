<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title description">
  <title id="title">SecureLink safely blocks a localhost destination</title>
  <desc id="description">A sanitized result from SecureLink's controlled local SSRF safety test. The localhost URL is scored high risk and blocked before any outbound connection.</desc>
  <defs>
    <linearGradient id="page" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#10151a"/>
      <stop offset="1" stop-color="#080a0d"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1">
      <stop stop-color="#53eaff"/>
      <stop offset=".46" stop-color="#ef69d3"/>
      <stop offset=".73" stop-color="#ffe45b"/>
      <stop offset="1" stop-color="#cfff53"/>
    </linearGradient>
    <linearGradient id="risk" x1="0" x2="1">
      <stop stop-color="#ff8e8e"/>
      <stop offset="1" stop-color="#e34d69"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#fff" stroke-opacity=".035"/>
    </pattern>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000" flood-opacity=".35"/>
    </filter>
  </defs>

  <rect width="1600" height="1000" fill="url(#page)"/>
  <rect width="1600" height="1000" fill="url(#grid)"/>
  <rect x="72" y="60" width="1456" height="880" rx="16" fill="#12171d" stroke="#ffffff" stroke-opacity=".14" filter="url(#shadow)"/>
  <rect x="72" y="60" width="1456" height="5" rx="2.5" fill="url(#accent)"/>

  <g fill="#efeee8" font-family="Arial, Helvetica, sans-serif">
    <text x="130" y="138" font-size="34" font-weight="800" letter-spacing="-2">SECURE<tspan fill="#d7ff54">LINK</tspan></text>
    <rect x="130" y="164" width="12" height="12" rx="6" fill="#d7ff54"/>
    <text x="154" y="175" fill="#aeb4aa" font-family="monospace" font-size="15" letter-spacing="1.4">CONTROLLED LOCAL SAFETY TEST</text>
    <text x="130" y="240" fill="#aeb4aa" font-family="monospace" font-size="15" letter-spacing="1.5">ANALYSIS COMPLETE / DIRECT URL</text>

    <rect x="130" y="276" width="322" height="332" rx="12" fill="#181e25" stroke="#ffffff" stroke-opacity=".12"/>
    <text x="164" y="326" fill="#ff9a9a" font-family="monospace" font-size="16" font-weight="700" letter-spacing="1.4">HIGH RISK</text>
    <text x="160" y="474" font-size="170" font-weight="800" letter-spacing="-12">55</text>
    <text x="337" y="465" fill="#aeb4aa" font-family="monospace" font-size="20">/100</text>
    <rect x="164" y="518" width="253" height="8" rx="4" fill="#303842"/>
    <rect x="164" y="518" width="139" height="8" rx="4" fill="url(#risk)"/>
    <text x="164" y="565" fill="#c4c8c1" font-size="18">A destination should be verified</text>
    <text x="164" y="590" fill="#c4c8c1" font-size="18">before it is opened.</text>

    <g transform="translate(492 276)">
      <text font-size="44" font-weight="700" letter-spacing="-1.7">The link targets an IP address,</text>
      <text y="52" font-size="44" font-weight="700" letter-spacing="-1.7">not a named website.</text>
      <text y="98" fill="#b6bbb4" font-size="20">The destination was classified and contained without a network request.</text>
      <rect y="132" width="666" height="64" rx="8" fill="#0d1116" stroke="#ffffff" stroke-opacity=".12"/>
      <text x="24" y="172" fill="#caecff" font-family="monospace" font-size="20">http://127.0.0.1/</text>
    </g>

    <g transform="translate(1192 276)">
      <rect width="236" height="210" rx="12" fill="#1b2320" stroke="#d7ff54" stroke-opacity=".85" stroke-width="2"/>
      <path d="M38 48l18-12 18 12v23c0 20-15 30-18 32-3-2-18-12-18-32V48z" fill="none" stroke="#d7ff54" stroke-width="3"/>
      <path d="M49 69l6 6 14-17" fill="none" stroke="#d7ff54" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"/>
      <text x="38" y="133" fill="#b8c1b1" font-family="monospace" font-size="13" font-weight="700" letter-spacing="1">RECOMMENDATION</text>
      <text x="38" y="164" font-size="19" font-weight="700">Do not open this link.</text>
      <text x="38" y="190" fill="#d4d9d0" font-size="16">Verify the destination first.</text>
    </g>

    <line x1="130" y1="660" x2="1470" y2="660" stroke="#ffffff" stroke-opacity=".15"/>
    <text x="130" y="712" fill="#b4b9b1" font-family="monospace" font-size="15" letter-spacing="1.5">WHY THIS RESULT</text>

    <g transform="translate(130 744)">
      <rect width="634" height="130" rx="10" fill="#171d24" stroke="#ffffff" stroke-opacity=".12"/>
      <rect width="6" height="130" rx="3" fill="#ff7680"/>
      <text x="32" y="40" fill="#ff9a9a" font-family="monospace" font-size="14" font-weight="700" letter-spacing="1.1">HIGH SIGNAL / 100% CONFIDENCE</text>
      <text x="32" y="77" font-size="24" font-weight="700">Unsafe destination blocked</text>
      <text x="32" y="107" fill="#c4c9c2" font-size="18">SecureLink did not connect because the destination was not publicly routable.</text>
    </g>
    <g transform="translate(796 744)">
      <rect width="674" height="130" rx="10" fill="#171d24" stroke="#ffffff" stroke-opacity=".12"/>
      <text x="32" y="40" fill="#d7ff54" font-family="monospace" font-size="14" font-weight="700" letter-spacing="1.1">DESTINATION STATUS</text>
      <text x="32" y="77" font-size="24" font-weight="700">Blocked before outbound inspection</text>
      <text x="32" y="107" fill="#c4c9c2" font-size="18">Redirect record: Destination is a non-public address</text>
    </g>
  </g>
</svg>
